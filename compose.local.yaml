services:
  lucky-note:
    build: .
    ports:
      - "127.0.0.1:4317:4317"
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      ALLOW_NETWORK: "true"
      AUTH_MODE: local
      APP_ORIGIN: http://127.0.0.1:4317
      PORT: "4317"
      DATA_DIR: /data
    volumes:
      - lucky-note-local-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
volumes:
  lucky-note-local-data:
