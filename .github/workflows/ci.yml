name: Verify LuckyNote
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: node scripts/secret-scan.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build:local && npm run build:preview
      - run: npm run test:local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation
          path: |
            playwright-report/
            test-results/
          retention-days: 7
